# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
# Run the Gradle daemon on JDK 21 (Gradle 8.6 supports it) regardless of the shell's
# JAVA_HOME - the machine default is JDK 26, which Gradle cannot run on. The actual
# compile/run toolchain is JDK 17 (auto-provisioned by foojay; see settings.gradle).
org.gradle.java.home=C:/Program Files/Java/jdk-21.0.10
# A persistent daemon manages ForgeGradle's decompression-cache locks across the
# build better than a forked single-use daemon (avoids the intermittent
# "Unexpected lock protocol" failure during the official-remap step).
org.gradle.daemon=true
org.gradle.parallel=false
# ForgeGradle 6 is incompatible with Gradle's configuration cache.
org.gradle.configuration-cache=false
# File-system watching can hold Windows lock files open and interfere with
# ForgeGradle's archive-expansion cache; disabling it keeps builds reliable here.
org.gradle.vfs.watch=false

# Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
# Minimum Forge accepted at runtime kept loose so users on any stable 47.x can launch the mod
forge_version_range=[47,)
loader_version_range=[47,)

# Mod Properties
mod_id=wavify
mod_name=Wavify
mod_license=MIT
mod_version=1.1.2
mod_group_id=net.superkat.wavify
mod_authors=Superkat32
mod_description=Dynamic ocean, shoreline, and river waves for Minecraft.
