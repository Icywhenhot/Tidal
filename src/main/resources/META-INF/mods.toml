modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Superkat32/Wavify/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://modrinth.com/mod/wavify-waves"
logoFile="assets/wavify/icon.png"
authors="${mod_authors}"
description='''
${mod_description}

Wavify adds ambient water motion to Minecraft with dedicated ocean and river wave systems, shader-aware rendering offsets, ambient shoreline audio, and off-thread scanning to keep wave generation smooth.
'''

# Mixin config is declared here so it loads in production; the dev runtime gets it from the MixinGradle plugin.
[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: when Dynamic Waters is installed, river waves follow the flow it carves. Wavify reads that
# mod purely reflectively (see DynamicWatersCompat), so it is never required - mandatory=false keeps
# Wavify fully functional on its own. Ordering=AFTER just lets Dynamic Waters load first when present.
[[dependencies.${mod_id}]]
    modId="dynamicwaters"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
